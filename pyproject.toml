[project]
name = "trading-lab"
version = "0.1.0"
description = "Multi-strategy trading lab: sniper (intraday) + swing momentum — backtest → sim → paper"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "tzdata>=2024.1",
  "boto3>=1.34",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
