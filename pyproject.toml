[project]
name = "trading-lab"
version = "0.1.0"
description = "Multi-strategy trading lab: sniper (intraday) + swing momentum — backtest → sim → paper"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "tzdata>=2024.1",
  "boto3>=1.34",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
  "ty>=0.0.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
