# Copy into a consumer repo as .github/workflows/deploy.yml
# Single AWS/GitHub Environment "dev" — feature branches get isolated previews.
#
# Pipeline: meta → CI → Docker Lambda → ECR → OpenTofu
#
# AWS_ROLE_ARN must be the app-deploy OIDC role from aws-cicd:
#   cd aws-cicd/environments/account && tofu output github_actions_app_deploy_role_arn
# Role name: platform-gha-app-deploy
# Optional AWS_APPLY_ROLE_ARN → platform-gha-app-deploy-apply
# Do NOT use platform-gha-workstation for app ECR/Lambda.
# State keys: apps/<project_name>/dev|feat-<slug>/terraform.tfstate
#
# Branches:
#   main     → shared stack (workspace default, :latest), plan on push
#   feature/* → preview stack (workspace feat-<slug>, name_prefix suffix), plan on push
#
# Manual (any branch): Actions → Deploy → select branch → plan | apply | destroy

name: Deploy

on:
  push:
    branches:
      - main
      - "feature/**"
      - "feat/**"
      - "fix/**"
      - "chore/**"
    paths:
      - "api/**"
      - "src/**"
      - "infra/**"
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - "requirements*.txt"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      action:
        description: OpenTofu action
        type: choice
        options: [plan, apply, destroy]
        default: plan

permissions:
  contents: read
  id-token: write
  # Ceiling for reusable workflows (python-ci security job). Do NOT add
  # attestations/packages here — they caused repo-wide startup_failure.
  pull-requests: read

concurrency:
  # One deploy at a time per branch (feature previews do not block main)
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    name: Resolve branch deploy context
    runs-on: ubuntu-latest
    outputs:
      is_default_branch: ${{ steps.vars.outputs.is_default_branch }}
      branch_slug: ${{ steps.vars.outputs.branch_slug }}
      name_prefix: ${{ steps.vars.outputs.name_prefix }}
      tofu_workspace: ${{ steps.vars.outputs.tofu_workspace }}
      image_name: ${{ steps.vars.outputs.image_name }}
      state_key: ${{ steps.vars.outputs.state_key }}
    steps:
      # Inline meta (private repos cannot always resolve composite actions via owner/repo@ref).
      # Prefer .github/actions/branch-meta when Actions access to cicd-templates is enabled.
      - id: vars
        env:
          APP_NAME: trading-lab
        run: |
          set -euo pipefail
          REF="${GITHUB_REF_NAME}"
          DEFAULT_BRANCH="${{ github.event.repository.default_branch || 'main' }}"
          SLUG="$(echo "$REF" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9-]+/-/g; s/^-+|-+$//g' | cut -c1-40)"

          if [ "$REF" = "$DEFAULT_BRANCH" ]; then
            echo "is_default_branch=true" >> "$GITHUB_OUTPUT"
            echo "name_prefix=${APP_NAME}" >> "$GITHUB_OUTPUT"
            echo "tofu_workspace=default" >> "$GITHUB_OUTPUT"
            echo "state_key=apps/${APP_NAME}/dev/terraform.tfstate" >> "$GITHUB_OUTPUT"
          else
            echo "is_default_branch=false" >> "$GITHUB_OUTPUT"
            echo "name_prefix=${APP_NAME}-feat-${SLUG}" >> "$GITHUB_OUTPUT"
            echo "tofu_workspace=feat-${SLUG}" >> "$GITHUB_OUTPUT"
            echo "state_key=apps/${APP_NAME}/feat-${SLUG}/terraform.tfstate" >> "$GITHUB_OUTPUT"
          fi
          echo "branch_slug=${SLUG}" >> "$GITHUB_OUTPUT"
          echo "image_name=${APP_NAME}" >> "$GITHUB_OUTPUT"

  ci:
    needs: meta
    uses: davidali1689/cicd-templates/.github/workflows/python-ci.yml@v1.0.6
    with:
      working-directory: .
      python-version: "3.13"
      mock-bedrock: true
      # FS scan report-only; image Trivy gates in build
      trivy-exit-code: "0"

  build:
    needs: [meta, ci]
    uses: davidali1689/cicd-templates/.github/workflows/docker-build-scan.yml@v1.0.6
    with:
      context: .
      dockerfile: Dockerfile
      image-name: ${{ needs.meta.outputs.image_name }}
      branch-slug: ${{ needs.meta.outputs.branch_slug }}
      is-default-branch: ${{ needs.meta.outputs.is_default_branch == 'true' }}
      ecr-registry: ${{ vars.ECR_REGISTRY }}
      push-image: true
      create-ecr-repo: true
      apply-ecr-lifecycle: true
      generate-sbom: true
      trivy-exit-code: "1"
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

  deploy:
    needs: [meta, ci, build]
    uses: davidali1689/cicd-templates/.github/workflows/deploy-lambda.yml@v1.0.6
    with:
      # Push → plan. Dispatch → chosen action (apply/destroy from feature branch = preview stack).
      action: ${{ github.event_name == 'workflow_dispatch' && inputs.action || 'plan' }}
      tofu-directory: infra
      environment-name: dev
      tofu-workspace: ${{ needs.meta.outputs.tofu_workspace }}
      name-prefix: ${{ needs.meta.outputs.name_prefix }}
      state-key: ${{ needs.meta.outputs.state_key }}
      image-uri: ${{ needs.build.outputs.image-uri }}
      image-tag: ${{ needs.build.outputs.image-tag }}
      ecr-repository-url: ${{ needs.build.outputs.ecr-repository-url }}
      # Optional: set to Function URL; empty = try tofu output lambda_function_url
      health-check-url: ""
      health-check-path: "/health"
      check-bedrock-tags: false
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      AWS_APPLY_ROLE_ARN: ${{ secrets.AWS_APPLY_ROLE_ARN }}
