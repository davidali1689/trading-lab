# Copy into a consumer repo as .github/workflows/ci.yml
# Prefer pyproject.toml + uv.lock (see templates/pyproject.toml).
#
# Jobs: lint | typecheck | test | security (parallel)

name: CI

on:
  pull_request:
    paths:
      - "api/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "requirements*.txt"
      - "Dockerfile"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "api/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "requirements*.txt"
      - "Dockerfile"
      - ".github/workflows/ci.yml"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    uses: davidali1689/cicd-templates/.github/workflows/python-ci.yml@v1.0.6
    with:
      working-directory: .
      python-version: "3.13"
      lint-paths: .
      test-paths: tests
      security-paths: .
      mock-bedrock: true
      # Report-only Trivy fs on PRs; image gate is in docker-build-scan (exit 1)
      trivy-exit-code: "0"
